# ═══════════════════════════════════════════════════════════════
#  AJUSTES DE LA FÁBRICA DE SHORTS
#  Puedes cambiarlos con el Bloc de notas. Guarda y vuelve a crear
#  los vídeos para ver el cambio.
#  Las líneas que empiezan por # son comentarios (no hacen nada).
# ═══════════════════════════════════════════════════════════════

[video]
ancho = 1080          # 1080 x 1920 = formato vertical 9:16
alto = 1920
fps = 30
cola_final = 0.8      # segundos extra al final para que no corte de golpe
duracion_aviso = 59   # avisa si un vídeo dura más que esto

[render]
# "auto"  = usa la tarjeta NVIDIA (NVENC) si está disponible; si no, el procesador
# "nvenc" = obliga a usar la NVIDIA
# "cpu"   = obliga a usar el procesador
codificador = "auto"
calidad = 20          # 18 = mejor calidad (archivo grande) · 24 = más ligero

[voz]
# "auto"   = voz dominicana de Microsoft; si no hay internet, voz en español sin internet
# "edge"   = solo voz dominicana (si falla, da error)
# "prueba" = voz en español sin internet (Kokoro), sin acento dominicano
motor = "auto"
pausa_entre_frases = 0.22   # segundos de silencio entre una frase y la siguiente

[musica]
activar = true            # false = vídeos sin música
# "dembow"  = la fábrica compone un beat de dembow ORIGINAL (sin copyright), distinto en cada vídeo
# "carpeta" = usa una canción tuya de assets/musica (¡solo sin copyright!)
origen = "dembow"
volumen = 1.0             # 0.5 = más bajita · 1.5 = más fuerte
bajar_al_hablar = true    # la música baja sola cuando alguien habla
bpm = 122                 # velocidad del dembow (118-128 suena bien)

# ─── PERSONAJES ────────────────────────────────────────────────
# En los guiones cada frase empieza por el nombre en MAYÚSCULAS
# (FELLO: ... / YEFRI: ...). Aquí se decide cómo suena y se ve cada uno.
#   voz       = voz de Microsoft (es-DO = República Dominicana)
#   velocidad = más rápido "+10%" / más lento "-10%"
#   tono      = más agudo "+20Hz" / más grave "-10Hz"
#   color     = color de su nombre y de sus palabras en los subtítulos
#   voz_respaldo / velocidad_respaldo = voz sin internet (em_santa, em_alex, ef_dora)

[personajes.FELLO]
nombre = "Don Fello"
voz = "es-DO-EmilioNeural"
velocidad = "-4%"
tono = "-10Hz"
voz_respaldo = "em_santa"
velocidad_respaldo = 0.95
color = "#FFC93C"
dibujo = "fello"          # personaje 2D (fello / yefri)
lado = "izquierda"

[personajes.YEFRI]
nombre = "Yefri"
voz = "es-DO-EmilioNeural"
velocidad = "+12%"
tono = "+22Hz"
voz_respaldo = "em_alex"
velocidad_respaldo = 1.1
color = "#3DF5C8"
dibujo = "yefri"
lado = "derecha"
